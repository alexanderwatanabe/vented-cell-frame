<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vented cell frame</title>
<link rel="icon" href="data:,">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1b; --muted: #65635d; --line: #dedbd3;
    --accent: #c4600f; --accent-soft: #fbeee2; --ok: #2f7d4f; --bad: #b3261e; --pending: #8a6d1f; --field: #fbfaf8;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161614; --panel: #1f1f1c; --ink: #ecebe6; --muted: #a5a39b; --line: #36352f;
      --accent: #f08a3a; --accent-soft: #3a2a1c; --ok: #6cc391; --bad: #f08a80; --pending: #e0c060; --field: #262622;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161614; --panel: #1f1f1c; --ink: #ecebe6; --muted: #a5a39b; --line: #36352f;
    --accent: #f08a3a; --accent-soft: #3a2a1c; --ok: #6cc391; --bad: #f08a80; --pending: #e0c060; --field: #262622;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  button { font: inherit; color: inherit; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 24px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
  h1 { font-size: 18px; margin: 0; font-weight: 650; }
  header .tagline { color: var(--muted); font-size: 13.5px; }
  header .spacer { flex: 1; }
  header a { color: var(--muted); font-size: 13px; }
  #steps { display: flex; gap: 6px; flex-wrap: wrap; padding: 12px 20px 0; }
  #steps button { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--panel); padding: 7px 14px 7px 8px; border-radius: 999px; cursor: pointer; }
  #steps .num { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--line); font-size: 12.5px; font-weight: 600; }
  #steps button[aria-current="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  #steps button[aria-current="true"] .num { background: var(--accent); color: #fff; }
  #intro { margin: 10px 20px 0; max-width: 900px; color: var(--muted); }
  main { display: grid; grid-template-columns: minmax(320px, 420px) 1fr; margin-top: 12px; border-top: 1px solid var(--line); }
  #form { border-right: 1px solid var(--line); padding: 4px 16px 40px; overflow-y: auto; max-height: calc(100vh - 150px); background: var(--panel); }
  .group { border-bottom: 1px solid var(--line); padding: 4px 0 8px; }
  .group summary { cursor: pointer; font-weight: 600; padding: 8px 0; }
  .group .tag { margin-left: 8px; font-weight: 400; font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
  .field { display: grid; grid-template-columns: 1fr minmax(110px, 150px) 22px; gap: 2px 8px; align-items: center; padding: 7px 4px 7px 10px; border-left: 3px solid transparent; border-radius: 0 6px 6px 0; }
  .field:has(.pair) { grid-template-columns: 1fr minmax(170px, 210px) 22px; }
  .field.set { border-left-color: var(--accent); }
  .field.flash { animation: flash 1.6s ease-out; }
  @keyframes flash { from { background: var(--accent-soft); } to { background: transparent; } }
  .field .label { font-size: 14px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
  .field code { font: 11px ui-monospace, "SF Mono", Menlo, monospace; color: var(--muted); }
  .field .help, .field .note { grid-column: 1 / 3; color: var(--muted); font-size: 12.5px; }
  .field .note { color: var(--ink); }
  .field a { color: var(--accent); }
  .field .reset { visibility: hidden; border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0; font-size: 15px; }
  .field.set .reset { visibility: visible; }
  .field .reset:hover, .field .reset:focus-visible { color: var(--accent); }
  .pair { display: grid; grid-template-columns: 1fr 64px; gap: 6px; align-items: center; }
  input[type="range"] { width: 100%; accent-color: var(--accent); }
  input:not([type="range"]), select { width: 100%; font: inherit; font-size: 14px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 5px; background: var(--field); color: var(--ink); }
  input::placeholder { color: var(--muted); }
  .quiet { margin-top: 14px; background: transparent; border: 1px solid var(--line); padding: 6px 12px; border-radius: 6px; cursor: pointer; }
  section.out { padding: 16px 20px; display: grid; grid-template-columns: minmax(260px, 330px) 1fr; gap: 16px; align-content: start; min-width: 0; }
  #check { grid-column: 1 / -1; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); }
  #check strong { display: block; }
  #check[data-status="ok"] { border-color: var(--ok); }
  #check[data-status="ok"] strong { color: var(--ok); }
  #check[data-status="ok"] strong::before { content: "✓ "; }
  #check[data-status="refused"], #check[data-status="failed"] { border-color: var(--bad); }
  #check[data-status="refused"] strong, #check[data-status="failed"] strong { color: var(--bad); }
  #check[data-status="refused"] strong::before, #check[data-status="failed"] strong::before { content: "✕ "; }
  #check[data-status="pending"] strong { color: var(--pending); }
  #check[data-status="pending"] strong::before { content: "◌ "; display: inline-block; animation: spin 1.2s linear infinite; }
  #check ul { margin: 6px 0 0; padding-left: 20px; }
  #check .hint { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
  .link { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; cursor: pointer; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #results { display: grid; gap: 16px; align-content: start; }
  #results.stale, #check.stale { opacity: 0.45; }
  .field.invalid input:not([type="range"]) { border-color: var(--bad); }
  .result h3 { font-size: 12.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 0 0 4px; }
  .result table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  .result th { text-align: left; font-weight: 400; color: var(--muted); padding: 3px 8px 3px 0; }
  .result td { text-align: right; padding: 3px 0; }
  .wallmap { margin: 10px 0 0; }
  .wallmap canvas { display: block; border-bottom: 1px solid var(--line); }
  .wallmap figcaption { color: var(--muted); font-size: 12.5px; margin-top: 6px; }
  .key { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; }
  .key.wall { background: var(--accent); opacity: 0.7; }
  .key.touch { background: var(--ink); }
  .stage { display: grid; grid-template-rows: auto 1fr; gap: 8px; min-height: 460px; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  #render { padding: 8px 16px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; font-weight: 600; }
  #download { padding: 7px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; }
  #download:disabled { opacity: 0.4; cursor: default; }
  #render-status { color: var(--muted); font-size: 13.5px; }
  #render-status[data-status="failed"] { color: var(--bad); }
  #render-status[data-status="done"] { color: var(--ok); }
  #stale-note { color: var(--pending); font-size: 13.5px; }
  #viewer { position: relative; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); min-height: 420px; overflow: hidden; }
  #viewer canvas { display: block; width: 100%; height: 100%; position: absolute; inset: 0; }
  #viewer.stale canvas { opacity: 0.45; }
  #empty[hidden] { display: none; }
  .muted { color: var(--muted); margin: 0; }
  #empty { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--muted); padding: 24px; pointer-events: none; }
  @media (prefers-reduced-motion: reduce) {
    #check[data-status="pending"] strong::before { animation: none; }
    .field.flash { animation: none; background: var(--accent-soft); }
  }
  @media (max-width: 980px) {
    main { grid-template-columns: 1fr; }
    #form { border-right: 0; border-bottom: 1px solid var(--line); max-height: none; }
    section.out { grid-template-columns: 1fr; padding: 16px; }
    #steps, header { padding-left: 16px; padding-right: 16px; }
    #intro { margin-left: 16px; margin-right: 16px; }
  }
</style>
</head>
<body>
<header>
  <h1>Vented cell frame</h1>
  <span class="tagline">A printable, vented frame for a block of cylindrical cells</span>
  <span class="spacer"></span>
  <a href="https://github.com/alexanderwatanabe/vented-cell-frame#readme">How it works</a>
</header>
<nav id="steps" aria-label="Steps"></nav>
<p id="intro"></p>
<main>
  <form id="form" autocomplete="off" onsubmit="return false"></form>
  <section class="out">
    <div id="check" data-status="pending" role="status" aria-live="polite"><strong>Loading OpenSCAD…</strong></div>
    <div id="results" aria-label="What the design works out to"></div>
    <div class="stage">
      <div class="bar">
        <button id="render" type="button">Render</button>
        <button id="download" type="button" disabled>Download STL</button>
        <span id="render-status" role="status"></span>
        <span id="stale-note" hidden>This view is of an earlier setting: render again.</span>
      </div>
      <div id="viewer" aria-label="3D view of the rendered part">
        <div id="empty">Render to see the part in 3D and download it.<br>A coupon set takes a few seconds; a full frame up to a minute or two.</div>
      </div>
    </div>
  </section>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
